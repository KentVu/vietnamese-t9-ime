[versions]

project = "1.0.0"
kotlin = "2.0.10"
agp = "8.2.0"
jvmTarget = "11"
#jvmToolchain = "17"

android-minSdk = "24"
android-compileSdk = "34"
android-targetSdk = "34"

compose-multiplatform = "1.6.11"
compose-ui = "1.6.11"

coroutines = "1.8.1"
coroutines-test = "1.8.1"

androidx-activity = "1.9.0"
androidx-activityCompose = "1.9.0"
androidx-appcompat = "1.6.1"
androidx-core = "1.13.1"
androidx-core-ktx = "1.12.0"

junit = "4.13.2"
decompose = "3.1.0"
essenty = "2.1.0"
koin = "3.5.2-RC1"
sqlDelight = "2.0.2"
datetime = "0.6.0"

[plugins]

kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }

[libraries]

androidx-activity-activityCompose = { group = "androidx.activity", name = "activity-compose", version.ref = "androidx-activityCompose" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidx-appcompat" }
androidx-core = { group = "androidx.core", name = "core", version.ref = "androidx-core" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core-ktx" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling", version.ref = "compose-ui" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview", version = "1.6.7" }
androidx-compose-ui-uiTestJunit4 = { group = "androidx.compose.ui", name = "ui-test-junit4", version.ref = "compose-ui" }

kotlin-test = { group = "org.jetbrains.kotlin", name = "kotlin-test", version.ref = "kotlin" }
kotlin-test-junit = { group = "org.jetbrains.kotlin", name = "kotlin-test-junit", version.ref = "kotlin" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-swing = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-swing", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines-test" }
kotlinx-datetime = { group = "org.jetbrains.kotlinx", name = "kotlinx-datetime", version.ref = "datetime" }

junit = { group = "junit", name = "junit", version.ref = "junit" }
napier = { group = "io.github.aakira", name = "napier", version = "2.6.1" }
okio = { group = "com.squareup.okio", name = "okio", version = "3.8.0" }
okio-fakefilesystem = { group = "com.squareup.okio", name = "okio-fakefilesystem", version = "3.8.0" }
doistx-normalize = { group = "com.doist.x", name = "normalize", version = "1.0.5" }
